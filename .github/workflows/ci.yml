name: CI

# Nothing here may reach a model API, spend a token, or push to a repository.
# The Python suite is hermetic by construction: tests/conftest.py installs an
# autouse fixture that swaps ClaudeBackend for a stub everywhere the
# orchestrator builds one, and it only steps aside when NH_TESTS_LIVE_SDK=1,
# which is never set in CI. The `real_backend` marker exempts a handful of
# tests from that stub, but those drive the real class over a mocked SDK
# client and still make no network call.
#
# The live `nh eval` / `nh bench` runs spend subscription tokens through the
# Agent SDK. They are run locally, on demand, and are not part of any job here.

on:
  push:
    branches: [main]
  pull_request:
  # The nightly lane's manual handle. `-m "slow or nightly"` collects the heavy
  # guards whose protection is consumed off the push path, so they need a
  # trigger that is not a push; without one the mark would just switch them off.
  #
  # NO `schedule:` HERE, deliberately, and the reason is the one this whole
  # change exists for. `schedule` is workflow-level, not job-level, and the
  # `desktop` and `windows` jobs below gate on `github.event_name !=
  # 'pull_request'` — which is TRUE for a scheduled run. A cron would therefore
  # fire python + web + desktop + windows every night, and windows bills at 2x
  # a Linux minute with a 45-minute timeout. Adding a nightly bill to a repo
  # whose presenting problem is exhausted Actions minutes is the opposite of
  # the fix. (The `concurrency` group below is a second reason: it keys on
  # `github.ref`, so a scheduled run on main and a push to main share a group
  # under `cancel-in-progress: true` — a merge would silently cancel the
  # nightly, and a cancelled run is not a red one.)
  #
  # Where the lane actually runs today: the machine's own 03:00 launchd job,
  # `scripts/nightly_eval.sh`, which invokes `./scripts/run_tests.sh nightly`.
  # A cron here is only worth adding once windows/desktop/web carry a
  # `github.event_name != 'schedule'` guard of their own.
  #
  # `linux_release`: a dispatch is ALSO the nightly lane's handle (above), so
  # the linux job's package upload — one of the two places this workflow lets
  # an installable leave the runner; `wheel_release` below is the other — keys
  # on this explicit input, never on the bare event. Default false: a dispatch
  # fired for the guards produces no downloadable app and (below) does not run
  # the linux job at all.
  workflow_dispatch:
    inputs:
      linux_release:
        description: "Linux: build the release packages and keep them as a 7-day run artefact"
        type: boolean
        default: false
      wheel_release:
        description: "Wheel: keep the board-carrying wheel as a 90-day run artefact"
        type: boolean
        default: false
      windows_release:
        description: "Windows: build the UNSIGNED installer + zip and keep them as a 7-day run artefact"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Agreement to CLA.md is recorded as a file in contributors/, not in a
  # third-party signing service. This job is the only thing that notices when
  # one is missing: it asks GitHub who authored the commits in the PR — GitHub
  # resolves the login, so nothing here has to guess at email identity — and
  # fails if any of them has no ledger entry. It checks that a file exists and
  # nothing more; it cannot verify a signature and does not try to.
  cla:
    name: CLA ledger
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Every commit author has a contributors/ entry
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The maintainer does not sign their own agreement.
          MAINTAINER: eyalgolan
          # Who OPENED the PR — gates the agent-account exemption below.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # .author.login is null when the commit's email address is not
          # attached to any GitHub account. That is unsigned as far as this
          # ledger is concerned, and the error below says how to fix it.
          authors=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            --jq '.[].author.login // "UNLINKED-EMAIL"' | sort -u)

          # The agent exemption is trusted only on PRs the agent (or the
          # maintainer) opened: anyone can forge a commit's author email, so a
          # fork PR by a stranger carrying "no-human"-authored commits must
          # still hit the ledger, not ride the exemption.
          agent_exempt=""
          case "$PR_AUTHOR" in
            no-human|"$MAINTAINER") agent_exempt=yes ;;
          esac

          missing=""
          for author in $authors; do
            if [ "$author" = "no-human" ]; then
              # This repo's own agent account: on a PR the agent or maintainer
              # opened, its commits are first-party work that lands identity-
              # normalized to the maintainer — nothing to license. On anyone
              # else's PR the author email was forged, and no ledger file may
              # ever satisfy it (like UNLINKED-EMAIL below): a stranger cannot
              # sign for our agent.
              [ "$agent_exempt" = "yes" ] || missing="${missing} ${author}"
              continue
            fi
            case "$author" in
              # Bot accounts (dependabot[bot], github-actions[bot]) hold no
              # copyright, so there is nothing for them to license.
              "$MAINTAINER"|*'[bot]') continue ;;
              # Never resolve the null-login sentinel to a filename: committing
              # contributors/unlinked-email.md would otherwise turn this job
              # green for an author GitHub cannot identify, which is the one
              # thing the ledger exists to prevent.
              UNLINKED-EMAIL) missing="${missing} ${author}"; continue ;;
            esac
            handle=$(printf '%s' "$author" | tr '[:upper:]' '[:lower:]')
            if [ ! -f "contributors/${handle}.md" ]; then
              missing="${missing} ${author}"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::No CLA ledger entry for:${missing}"
            echo
            echo "This pull request has commits by:${missing}"
            echo
            echo "Each of them needs to agree to CLA.md once, by adding one"
            echo "file to this PR:"
            for author in $missing; do
              if [ "$author" = "UNLINKED-EMAIL" ]; then
                echo "    (no file can be named for this one — see below)"
                continue
              fi
              if [ "$author" = "no-human" ]; then
                echo "    (no-human is this repo's own agent — commits carrying"
                echo "     its author email on an external PR look forged; no"
                echo "     ledger file can satisfy this. Re-commit as yourself.)"
                continue
              fi
              handle=$(printf '%s' "$author" | tr '[:upper:]' '[:lower:]')
              echo "    contributors/${handle}.md"
            done
            echo
            echo "The file says which version of CLA.md you agree to. Copy the"
            echo "template in contributors/README.md, fill it in, commit it,"
            echo "and push. You only ever do this once."
            echo
            echo "If an author above is UNLINKED-EMAIL, the email on those"
            echo "commits is not attached to a GitHub account, so GitHub cannot"
            echo "tell us who signed. Add it to your account, or re-commit with"
            echo "an address that is already there."
            exit 1
          fi

          echo "Every commit author has a contributors/ entry."

  # RELEASE_MANIFEST.txt pins every file in the release with its SHA-256, like
  # a lockfile for the tree itself. This verifies a checkout against it, in
  # both directions. Skipped on private mirrors and working repositories, whose
  # trees legitimately differ from a release; the released tree is where the
  # inventory is a hard invariant.
  inventory:
    name: File inventory
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --strict: on the released tree a tracked file with no manifest row is a
      # defect, so it must fail here exactly as it did before the warn/fail
      # split. The split exists for working repositories, where ~93 unlisted
      # paths are the normal state and used to mask real hash mismatches behind
      # an exit code that was already 1.
      - name: Tree matches RELEASE_MANIFEST.txt
        run: python scripts/check_release_manifest.py --strict

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # uv reads .python-version (3.12), so the toolchain cannot drift away
      # from the file that declares it.
      - name: Install dependencies
        run: uv sync --frozen

      # -n auto has wedged on this repo, so the worker count is explicit.
      #
      # The first two deselected tests read local IDE transcripts through
      # no_human.history.extractor, which scans running processes for a
      # language server. They raise IDENotRunningError on any machine without
      # that IDE open, which includes every CI runner.
      #
      # The third is deselected for a defect in the product, not in the runner.
      # test_two_repos_run_concurrently_in_worktrees is the only test that
      # drives two orchestrators against one Store at once, and a commit in
      # Store.update_attempt raises "cannot commit transaction - SQL statements
      # in progress" in roughly a third of runs. This is NOT an xdist flake: it
      # reproduces with no xdist and with the test running alone, so lowering
      # the worker count does nothing. Deselecting it keeps this badge honest
      # instead of red on a third of pushes; it does not pretend the race is
      # fixed. Repro data, the hypothesis already ruled out, and what a fix has
      # to prove are in docs/KNOWN_ISSUES.md (KI-1). Run it locally, repeatedly,
      # if you touch core/db.py or the scheduler.
      # Three lanes, ONE computed selector — a second job would be a second
      # thing to keep in sync, and the failure it fails at is a node that runs
      # in neither lane, which looks exactly like a node that passes.
      #
      #   pull_request              -m "not slow and not nightly"
      #   workflow_dispatch         -m "slow or nightly"
      #   push to main              (empty — everything, as before)
      #
      # `slow` is >10s each (the e2e/orchestrator tail that dominates
      # wall-clock). `nightly` is the heavy guards whose protection is consumed
      # off the push path. The two lanes partition the suite: every node is in
      # exactly one, which tests/test_test_lanes.py pins and the collection
      # counts reconcile. Every push to main still runs the full suite, so
      # every merged state carries the whole signal — same trade the windows
      # job below already makes, for the same reason: a job that bills its
      # worst case on every PR commit is a job that gets switched off.
      - name: Run tests
        run: |
          uv run pytest -q --tb=short -n 4 \
            ${{ (github.event_name == 'pull_request' && '-m "not slow and not nightly"') || (github.event_name == 'workflow_dispatch' && '-m "slow or nightly"') || '' }} \
            --deselect tests/test_scheduler.py::test_reanalysis_maybe_run_produces_result \
            --deselect tests/test_scheduler.py::test_reanalysis_dedup_across_runs \
            --deselect tests/test_scheduler.py::test_two_repos_run_concurrently_in_worktrees

      - name: Context files under load limits
        run: python scripts/check_context_files.py --claude CLAUDE.md

  web:
    name: Web board
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      # This job runs the node unit suite only. The Playwright suites in
      # web/e2e need a browser and, for some of them, a running server.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      # `npm test` passes an EXPLICIT FILE LIST (`node --test src/*.test.mjs`,
      # expanded by the shell npm runs the script in). That is the only form
      # that works across the whole Node range this repo touches, measured:
      #
      #   form                     Node 20.20.2        Node 22.22.3
      #   node --test src/         910 tests           ERR "Cannot find module .../src"
      #   node --test "src/**/..."  0 tests, exit 1    910 tests
      #   node --test src/*.test.mjs   910 tests       910 tests
      #
      # A directory argument stopped being walked in Node 22; --test glob
      # support does not exist in the Node 20 line, so a quoted glob is passed
      # through as a literal path and matches nothing — a red job that ran no
      # test at all. The file list depends on neither behaviour.
      #
      # Node 20 is kept on purpose: it is the OLDEST line the script claims to
      # support, so pinning it here is what keeps that claim measured rather
      # than asserted. .gitlab-ci.yml pins node:20-slim for the same job and
      # the same reason. web/src/testScriptCoverage.test.mjs fails if a test
      # file is ever added where `src/*.test.mjs` cannot see it.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # The bundle-scan tests (landed-override strings, term absence) read
      # web/dist, which is a build OUTPUT and not tracked — on a fresh
      # checkout there is nothing to scan and they fail with "web/dist/assets
      # is missing" (first public CI run, 2026-08-17). Build it first so the
      # scan runs against the same artefact a release would ship.
      - run: npm run build

      - run: npm test

  # The CLI's distributable form. `hatch_build.py` makes the board REQUIRED for a
  # standard wheel — a wheel without web/dist installs an `nh` whose main command
  # renders nothing, and that shipped once — so this job builds the board the way
  # the Web job does, builds the wheel, and then proves things ABOUT THE ARTEFACT
  # rather than about the tree: the board, the migrations and the `nh` entry point
  # are inside it; `uv tool install <wheel>` in an isolated tool dir yields an `nh`
  # that resolves its board from site-packages and finds the Agent SDK's bundled
  # `claude`, so the install needs neither Node nor a separately installed CLI.
  # No term scan runs here: the wheel carries nothing the tree and web/dist do
  # not already carry, the tree is gated by the export, and the built board's
  # term scan is the private identity-scrub guard (live on a checkout with a
  # built board; it skips in the bare-tree scrub job) — this public job does
  # not claim that coverage.
  #
  # The install step resolves the wheel's dependencies UNLOCKED from PyPI, on
  # purpose: that is what a user's `uv tool install` does, so an upstream
  # release that breaks the import turns this job red before it turns a user's
  # install red. `--python 3.12` pins the interpreter the tool env is built on
  # (tool installs do not read .python-version).
  #
  # Like the Linux and Windows bundles, the wheel is NOT uploaded from
  # arbitrary runs — an installable must not ride as a downloadable artefact of
  # every PR. A release build (workflow_dispatch with wheel_release) keeps it as
  # a 90-day run artefact to attach to the release. The public one-line
  # installer (getnohuman.com/install.sh) runs
  # `uv tool install git+https://github.com/no-human-ai/no_human` today and fails
  # on exactly the board rule above, because a clone has no web/dist; this wheel,
  # attached to a release, is what it should install instead.
  wheel:
    name: Wheel carries the board
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the board
        working-directory: web
        run: npm ci && npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      # Assertions over the zip, not the source tree. The migrations count is not
      # pinned (it grows); "at least one" is the property a boardless-CLI-style
      # omission would break.
      - name: The wheel carries the board, the migrations and the nh entry point
        run: |
          uv run --no-project python - <<'EOF'
          import glob, sys, zipfile
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          names = set(zipfile.ZipFile(wheels[0]).namelist())
          problems = []
          if "no_human/web_dist/index.html" not in names:
              problems.append("no board: no_human/web_dist/index.html is missing")
          if not any(n.startswith("no_human/web_dist/assets/") for n in names):
              problems.append("no board assets under no_human/web_dist/assets/")
          if not any("/migrations/" in n and n.endswith(".sql") for n in names):
              problems.append("no migrations/*.sql inside the package")
          ep = [n for n in names if n.endswith(".dist-info/entry_points.txt")]
          text = zipfile.ZipFile(wheels[0]).read(ep[0]).decode() if ep else ""
          if "nh = no_human.cli.commands:main" not in text:
              problems.append("entry_points.txt does not declare nh = no_human.cli.commands:main")
          print(wheels[0], len(names), "files; board files:",
                sum(1 for n in names if n.startswith("no_human/web_dist/")))
          if problems:
              print("\n".join("FAIL: " + p for p in problems)); sys.exit(1)
          EOF

      # The user-side proof, isolated from the runner's own tools. The same
      # command the one-line installer should run, pointed at the artefact.
      - name: Install the wheel the way a user would, and run it
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv-bin
        run: |
          uv tool install --force --python 3.12 dist/*.whl
          "$UV_TOOL_BIN_DIR/nh" --version
          "$UV_TOOL_BIN_DIR/nh" --help >/dev/null
          "$UV_TOOL_DIR/no-human/bin/python" - <<'EOF'
          from pathlib import Path
          from no_human.api.app import _resolve_web_dist
          from no_human.agent.backend_check import find_claude_cli
          board = _resolve_web_dist()
          assert (board / "index.html").is_file(), f"installed nh cannot find its board: {board}"
          assert "site-packages" in str(board), f"board resolved outside the package: {board}"
          cli = find_claude_cli()
          assert cli, "installed nh finds no claude CLI (the Agent SDK should bundle one)"
          print("board:", board); print("claude:", cli)
          EOF
          # THE RESOLUTION THIS STEP UNIQUELY SEES. `uv tool install` resolves
          # dependencies from PyPI, not from uv.lock — so this env is the only
          # one in CI that matches what a user gets. On 2026-08-20 that
          # difference shipped a broken `nh mcp-serve` in three releases: the
          # MCP SDK dropped `mcp.server.fastmcp` in 2.0.0, the requirement had
          # no upper bound, and every locked lane stayed green on 1.29.0.
          # Importing the bridge here is the cheap half of the check (it needs
          # no running API) and it fails on exactly that class.
          "$UV_TOOL_DIR/no-human/bin/python" -c "import no_human.intake.mcp_bridge; print('mcp bridge imports under a fresh resolution')"

      - name: Upload the wheel (release build only — workflow_dispatch with wheel_release)
        if: github.event_name == 'workflow_dispatch' && inputs.wheel_release
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 90

  # The MCP server, proven the way a registry proves it. Glama and the
  # directories that follow it run the server in a container and ask it to
  # answer `initialize` and `tools/list`; `nh mcp-serve` cannot do that alone,
  # because it refuses to start without no_human's local API — deliberately, so
  # that a bridge whose server is missing fails at launch instead of failing
  # every tool call. `Dockerfile.mcp` starts the API first, so this job builds
  # that image and drives a REAL MCP handshake over stdin/stdout inside it.
  # Without this, the first evidence of a broken image would be a third party's
  # "unhealthy" badge.
  #
  # `docker run -i` with no `-t`, and every diagnostic goes to stderr: stdout is
  # the JSON-RPC stream. No credential is used or needed — the container answers
  # introspection; it cannot run a task.
  #
  # IT ALSO BUILDS THE ROOT IMAGE, which nothing did before. `Dockerfile` sat
  # broken for its whole life — it never copied `hatch_build.py`, so `uv sync`
  # could not resolve a single dependency — and no job noticed, because no job
  # built it. Fixing the omission without adding the build would leave the same
  # hole open for the next one. It is only built here, never run: the product's
  # own container needs a credential mounted, which CI does not have.
  images:
    name: Container images build; the MCP one answers a handshake
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the MCP image
        run: docker build -f Dockerfile.mcp -t no-human-mcp:ci .

      - name: initialize + tools/list, inside the container
        run: python3 packaging/mcp_handshake_probe.py no-human-mcp:ci

      # Last, because it is the slow one (a node stage builds the board) and a
      # failure here is about the product image, not about MCP.
      - name: Build the product image
        run: docker build -t no-human:ci .

  desktop:
    name: Desktop shell
    # Same billing philosophy as the windows job below: ~20 Linux minutes a
    # run that a docs-only or Python-only PR should not pay for. Every push
    # to main runs it, so every merged state carries the signal; a PR opts in
    # by carrying the `desktop` label.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'desktop')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # --ignore-scripts skips Electron's postinstall, which fetches a ~100 MB
      # platform binary. The suite does not need it: Electron is stubbed
      # through desktop/testing/electronLoader.mjs.
      - run: npm ci --ignore-scripts

      # Icons are build OUTPUTS (untracked); packagedFiles.test.mjs checks the
      # .ico bytes on every platform, so derive them first. The .ico and .png
      # halves derive on Linux; derive-icons.mjs prints SKIP for icns, and the
      # test treats a non-darwin missing icns as underivable, not as the
      # stock-atom regression (first public CI run, 2026-08-17).
      - run: node ../packaging/derive-icons.mjs

      # `npm test` is `node --test .`, which Node 22 rejects, so the files are
      # listed explicitly. uiPages.test.mjs is the one suite that does need the
      # real Electron binary: it spawns a renderer to read computed styles.
      # Run it locally with a full `npm ci`.
      - name: Run tests
        run: |
          files=()
          for f in ./*.test.mjs; do
            [ "$f" = "./uiPages.test.mjs" ] && continue
            files+=("$f")
          done
          node --test "${files[@]}"

  # The only job here that is not ubuntu-latest. Everything Windows-specific in
  # this repo — packaging/build-installer.ps1, the `_IS_WINDOWS` branches in
  # config.py / testing/runner.py / api/app.py / cli/commands.py, and the 67
  # tests written to reach them — had no automated signal anywhere before this.
  # The two Windows suites ran only under a monkeypatched `_IS_WINDOWS` on a
  # POSIX host, which proves a branch is REACHABLE and cannot prove Windows
  # honours it. Here they run on the real OS.
  #
  # WHAT THIS JOB CANNOT SEE, so nobody reads more into a green tick than is
  # there. It is a build-and-test signal only:
  #   * Signing. Nothing below signs anything and no signing credential is
  #     configured. The bundle is Authenticode-UNSIGNED.
  #   * SmartScreen / Defender reputation, and Mark-of-the-Web on a downloaded
  #     file — all post-download, none reachable from a runner.
  #   * Installer UX. build-installer.ps1 produces the frozen onedir SERVER
  #     bundle (packaging\dist\nh-server\, nh.exe + _internal\), not the NSIS
  #     installer; nothing here runs an install, an upgrade or an uninstall.
  #   * That nh.exe RUNS. The script's gates check what is in the bundle; none
  #     of them launches it.
  #   * A hostile path. The runner's USERPROFILE is C:\Users\runneradmin and
  #     the checkout is D:\a\<repo>\<repo> — ASCII, no spaces, short. Paths
  #     with spaces, non-ASCII names or >260 chars are untested.
  #   * Windows PowerShell 5.1. GitHub's `pwsh` is PowerShell 7, so the 5.1
  #     defences the script documents (GetEncoding(28591) for Latin1, the
  #     BOM-less ANSI parse hazard) are never exercised here.
  #   * Windows 10, ARM64, and any non-UTF-8 console codepage.
  windows:
    name: Windows bundle (unsigned)
    # windows-latest bills at 2x a Linux minute and this is by far the most
    # expensive job in the file (a full board build plus a PyInstaller freeze),
    # so it deliberately does NOT run on every pull request — a docs-only PR
    # must not pay for it, because a job that bills on every commit is a job
    # that gets switched off. It runs on every push to main, so every merged
    # state carries the signal, and on demand for any PR that opts in by
    # carrying the `windows` label. Add the label to get a run; remove it to
    # stop paying.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'windows')
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      # fetch-depth: 0 on purpose. build-installer.ps1 refuses to build a
      # checkout that is behind origin/main (the stale-DMG guard). With the
      # default shallow fetch there is no origin/main ref for it to resolve,
      # the guard silently finds nothing and does not fire — a gate that cannot
      # fire, which is the exact defect that guard exists to prevent.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # desktop/package.json declares `engines: node >=22.12`; "22" resolves to
      # the newest 22.x, which satisfies it. Same major as the desktop job.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Creates .venv\Scripts\pyinstaller.exe, which the build script requires
      # by that exact path. pyinstaller is in the `dev` dependency-group, which
      # `uv sync` installs by default.
      - name: Install dependencies
        run: uv sync --frozen

      # build-installer.ps1 runs `npm run build` in web/ but does not install
      # into it — the same division of labour as build-installer.sh.
      - name: Install the board's dependencies
        working-directory: web
        run: npm ci

      # Run as a SEPARATE process via -File. The script signals failure with
      # `exit 1`; called in-process the exit would leave the step's own success
      # ambiguous, and a build gate that cannot turn a step red is not a gate.
      #
      # The build runs BEFORE the test steps on purpose: exercising
      # build-installer.ps1 end to end is half the point of the job, and a test
      # failure below must not hide a build that also broke.
      #
      # NH_ALLOW_STALE_BUILD is deliberately NOT set — the staleness guard is
      # left armed.
      #
      # Nothing is uploaded. This job is a build-and-test SIGNAL, not a release
      # channel: an unsigned server bundle parked as a downloadable CI artifact
      # reads like a deliverable and is not one. Releases have their own path.
      # (The linux job below applies the same rule with one deliberate, named
      # exception: packages ride as a 7-day artefact ONLY on a workflow_dispatch
      # run with the linux_release input set, which docs/LINUX.md defines as
      # the release build.)
      - name: Build the Windows bundle (UNSIGNED)
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File packaging\build-installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The same file list as the ubuntu desktop job, for the same reason:
      # uiPages.test.mjs is the one suite that needs the real Electron binary,
      # and `npm ci --ignore-scripts` skips the ~100 MB download that would
      # fetch it.
      - name: Install the desktop shell's dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts

      # Same reason as the ubuntu desktop job: icons are untracked build
      # outputs and the .ico byte checks need one. Windows derives the .ico
      # (Node-only) and skips icns, which the test treats as underivable here.
      - name: Derive icons
        working-directory: desktop
        run: node ../packaging/derive-icons.mjs

      - name: Desktop shell tests
        working-directory: desktop
        run: |
          $files = @(Get-ChildItem -Filter '*.test.mjs' -Name |
                     Where-Object { $_ -ne 'uiPages.test.mjs' })
          if ($files.Count -eq 0) { throw 'no desktop test files matched' }
          node --test @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The point of the whole job. On a POSIX host these 67 tests only ever
      # take the Windows branches through a monkeypatched `_IS_WINDOWS`; here
      # the branch is the host's, icacls and taskkill are the real programs,
      # and the paths are real WindowsPaths.
      #
      # Four tests are deselected, and ONLY these four. They assert
      # `stat().st_mode & 0o777 == 0o600` on the POSIX write path. Windows does
      # not model POSIX permission bits at all — every non-readonly file reads
      # back as 0o666 — so they cannot pass on this filesystem no matter which
      # branch is pinned, and relaxing the assertion would weaken the guard that
      # keeps a credential file private on the platform where it does ship.
      # They are covered by the ubuntu `python` job above, which is where that
      # code path runs. Measured and analysed in docs/WINDOWS.md §4.2.
      #
      # Nothing else is deselected. In particular the three `backend_check`
      # failures docs/WINDOWS.md reports — the Agent SDK's BUNDLED claude
      # resolving ahead of the operator's own on Windows — are left to fail.
      # That is an open product finding awaiting a decision, not a runner
      # artifact, and suppressing it here would be exactly the fake "done" this
      # job was added to make impossible. Expect this step red until it is
      # decided.
      - name: Windows portability and credential-file tests
        run: |
          # Built as an array and splatted rather than continued with backticks:
          # a pwsh line-continuation backtick is broken by a single trailing
          # space, and nothing in a YAML review would show that space.
          $skip = @(
            'tests/test_windows_portability.py::test_atomic_write_0600_posix_still_chmods',
            'tests/test_windows_portability.py::test_secure_credential_file_chmods_on_posix',
            'tests/test_windows_credential_file.py::test_atomic_write_0600_posix_still_chmods',
            'tests/test_windows_credential_file.py::test_secure_credential_file_chmods_on_posix'
          ) | ForEach-Object { '--deselect'; $_ }
          $argv = @(
            'run', 'pytest', '-q', '--tb=short',
            'tests/test_windows_portability.py',
            'tests/test_windows_credential_file.py',
            # The manifest is written through Python's text layer, so only this
            # job can catch a regression to CRLF rows. On linux it passes for
            # free and proves nothing.
            'tests/test_check_release_manifest.py'
          ) + $skip
          uv @argv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # RELEASE BUILD ONLY, the Windows twin of the linux job's release lane:
      # every gate above has already passed by the time these run, and they run
      # ONLY on a workflow_dispatch that set windows_release=true — a bundle
      # built from a random main push must not sit on the public repo as a
      # downloadable artefact (same refusal as the linux job's comment). The
      # full `npm ci` (scripts on) replaces the --ignore-scripts install above
      # because electron-builder needs the real Electron binary to package.
      - name: Install the desktop shell's dependencies WITH scripts (release build only)
        if: github.event_name == 'workflow_dispatch' && inputs.windows_release
        working-directory: desktop
        timeout-minutes: 10
        run: npm ci

      - name: Package the NSIS installer and the zip (release build only)
        if: github.event_name == 'workflow_dispatch' && inputs.windows_release
        working-directory: desktop
        timeout-minutes: 15
        run: npm run dist:win

      # Same contract as the linux job's verify step: exit 3 ("every check that
      # ran passed, and at least one was weakened") is the honest verdict for a
      # tree verifying the artefact it itself built, and is accepted HERE ONLY;
      # any other non-zero fails the job.
      - name: Verify the artefact against the source that built it (release build only)
        if: github.event_name == 'workflow_dispatch' && inputs.windows_release
        run: |
          uv run python scripts/verify_artefact.py desktop/dist/win-unpacked/resources/nh-server --repo . --repo-built-this-artefact
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3) { exit $LASTEXITCODE }
          exit 0

      # sha256sum's own output format (lowercase hash, two spaces, filename),
      # so `shasum -a 256 -c` on any POSIX machine verifies the download.
      - name: Checksums (release build only)
        if: github.event_name == 'workflow_dispatch' && inputs.windows_release
        working-directory: desktop/dist
        run: |
          $lines = Get-ChildItem -File | Where-Object { $_.Name -like 'no_human-*-UNSIGNED.exe' -or $_.Name -like 'no_human-*-UNSIGNED.zip' } | Sort-Object Name | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name
          }
          if ($lines.Count -eq 0) { throw 'no UNSIGNED artefacts found to checksum' }
          # WriteAllText with explicit LF, not Set-Content: on Windows Set-Content
          # terminates every line with CRLF, and `shasum -c` on a POSIX machine
          # then reads "no_human-...exe\r" - a filename that does not exist. The
          # whole point of sha256sum format is that any POSIX machine can verify
          # the download; measured broken on the first live windows_release run.
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'SHA256SUMS-windows.txt'), (($lines -join "`n") + "`n"), [Text.Encoding]::ASCII)
          Get-Content SHA256SUMS-windows.txt

      # 7 days, like the linux packages: long enough for a human to download,
      # re-verify the sums and attach to the GitHub release by hand; short
      # enough that a forgotten run is not a standing unsigned download.
      # latest.yml is never included: no auto-update path ships
      # (nhCanAutoUpdate is false on every platform).
      - name: Upload the packages (release build only — workflow_dispatch with windows_release)
        if: github.event_name == 'workflow_dispatch' && inputs.windows_release
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ github.sha }}
          path: |
            desktop/dist/no_human-*-UNSIGNED.exe
            desktop/dist/no_human-*-UNSIGNED.zip
            desktop/dist/SHA256SUMS-windows.txt
            desktop/dist/win-unpacked/resources/nh-server/BUILD_STAMP
          if-no-files-found: error
          retention-days: 7

  # Linux is the third member of ONE product (docs/LINUX.md). Same gating as
  # `windows`: every push to main, opt-in `linux` label on PRs, and on demand
  # via workflow_dispatch WITH linux_release=true (which is how a RELEASE build
  # is produced — the artefact of that run is what the operator attaches to the
  # GitHub release by hand; nothing here publishes anywhere).
  #
  # ubuntu-22.04 on purpose, not -latest: the frozen server links the runner's
  # glibc, so the build host IS the compatibility floor (2.35 -> Ubuntu 22.04+,
  # Debian 12+, Fedora 36+). Bumping this bumps the floor for every user, so it
  # is a decision, not a drift.
  #
  # WHAT THIS JOB SEES that the Windows job cannot: it INSTALLS the .deb and
  # LAUNCHES the installed app under Xvfb with a throwaway HOME, drives the
  # first-run credential screen with a dummy token, proves the board and the
  # bundled server answer, quits, and proves nothing is left running
  # (packaging/linux-acceptance.mjs — docs/WINDOWS.md §5.4 made automatic).
  # Screenshots ride in the run artefact so a human can look at what it saw.
  #
  # WHAT IT CANNOT SEE, so nobody reads more into a green tick than is there:
  #   * a real desktop session — the GNOME/KDE launcher, the PATH a .desktop
  #     launch inherits, the tray on a real panel;
  #   * the AppImage's FUSE and AppArmor (Ubuntu 24.04 unprivileged-userns)
  #     frictions — the runner runs it extracted, which sidesteps both;
  #   * a real task reaching a PR (that needs a real Claude credential, which a
  #     runner must never hold) — that is Lane B in docs/LINUX.md §7;
  #   * anything but x86_64 glibc 2.35+.
  linux:
    name: Linux bundle (deb + AppImage) + installed-app run
    # Same gate as windows, plus: a workflow_dispatch runs this job ONLY when
    # linux_release is set — a dispatch fired for the nightly guards must not
    # bill 15-25 minutes here nor produce packages (see the on: block).
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'linux'))
      || (github.event_name == 'workflow_dispatch' && inputs.linux_release)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      # fetch-depth: 0 for the same reason as the windows job: the stale-
      # checkout guard in build-installer.sh needs origin/main to exist, or it
      # silently cannot fire.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      # A `uses:` step has no shell to wrap in a retry loop, and setup-uv
      # already handles its own cache/download retries internally — a bound
      # is the only meaningful control here.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        timeout-minutes: 3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # setup-uv's own cache is scoped to that action; this is a second,
      # explicit pin of the uv download cache so a cold `uv sync --frozen`
      # (the observed 5-minute timeout on nearly every main commit) is the
      # exception, not the rule. restore-keys give a partial hit when uv.lock
      # moves incrementally, so a lock bump does not mean a full cold sync.
      - name: Cache uv's download cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      # Creates .venv/bin/pyinstaller, which build-installer.sh requires by that
      # exact path. pyinstaller is in the `dev` dependency-group.
      # uv sync is idempotent (it converges the venv to uv.lock), so a bounded
      # retry is safe. timeout-minutes is 15 (not 5): a cold `uv sync --frozen`
      # on this runner repeatedly exceeded 5 min, which is what this job was
      # timing out on — 15 is a realistic cold bound, still well inside the
      # job's 45-minute cap.
      - name: Install dependencies
        timeout-minutes: 15
        run: |
          err="$RUNNER_TEMP/uv-sync.err"
          n=1
          while true; do
            if uv sync --frozen 2>"$err"; then cat "$err" >&2; break; fi
            cat "$err" >&2
            if [ "$n" -ge 2 ]; then
              echo "uv sync failed on both attempts — uv stderr from the final attempt:" >&2
              cat "$err" >&2
              exit 1
            fi
            n=$((n + 1)); sleep 15
          done

      - name: Install the board's dependencies
        working-directory: web
        run: npm ci

      # A FULL install here (not --ignore-scripts): electron-builder needs the
      # Electron binary to package, and the AppImage/deb tooling it downloads.
      # The acceptance driver launches the INSTALLED app, not this copy.
      - name: Install the desktop shell's dependencies
        working-directory: desktop
        run: npm ci

      # The bundle gates run inside the script: 0 .py files, no ci_gate in the
      # PYZ table, no private term inventory, no build-machine path, a stamped
      # BUILD_STAMP. A failure here is a finding, never a step to soften.
      - name: Freeze the server (packaging/build-installer.sh, gates armed)
        run: bash packaging/build-installer.sh

      # derive-icons.mjs runs inside the script (icon.ico + icon.png; icns is
      # SKIPped off macOS, and the linux block never asks for it).
      - name: Package the .deb and the AppImage (x64)
        working-directory: desktop
        run: npm run dist:linux

      - name: What was built
        run: ls -la desktop/dist/ && cat desktop/dist/linux-unpacked/resources/nh-server/BUILD_STAMP

      # The stamp inside the artefact must name THIS commit and the board digest
      # must match — the stale-DMG class (2026-08-05: a clean build of the wrong
      # tree). This checkout IS the tree that built it, so the comparison is a
      # tautology for provenance and verify_artefact.py says so: with
      # --repo-built-this-artefact it exits 3 ("every check that ran passed,
      # and at least one was weakened") — the same honest verdict make-dmg.sh
      # accepts for every unsigned build. 3 is accepted HERE ONLY; any other
      # non-zero (stamp missing, digest mismatch, dirty tree) fails the job.
      - name: Verify the artefact against the source that built it
        run: |
          set +e
          uv run python scripts/verify_artefact.py desktop/dist/linux-unpacked/resources/nh-server \
            --repo . --repo-built-this-artefact
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then echo "verify_artefact: rc=3 — provenance tautological (built here), every check that ran passed"; exit 0; fi
          exit "$rc"

      # The runner image ships stale apt lists; the deb's Depends (libgtk-3-0,
      # libnotify4, libnss3, …) are fetched from apt, and xvfb-run must exist
      # for the installed-app run. Fetching them here fails loudly, before a
      # 404 mid-install reads as "the package is broken".
      # apt-get update is idempotent — it only refreshes lists — so a bounded
      # retry is safe. apt-get install is NOT retried: a missing package or a
      # broken dependency must fail the step the first time, not be retried
      # until it looks like a network blip.
      - name: apt lists + Xvfb
        timeout-minutes: 3
        run: |
          n=1
          until sudo apt-get update; do
            if [ "$n" -ge 2 ]; then echo "apt-get update failed on both attempts"; exit 1; fi
            n=$((n + 1)); sleep 15
          done
          sudo apt-get install -y xvfb

      # This is the product gate: dpkg/apt can leave a package half-configured,
      # so a retry is not state-neutral, and a failure here is a finding about
      # the package we just built, not a network blip to paper over. Not retried.
      - name: Install the .deb the way a user would
        timeout-minutes: 5
        run: sudo apt-get install -y ./desktop/dist/no_human-*-linux-amd64.deb

      # Outside the repo, with no toolchain: the frozen binary runs on its own.
      - name: The installed frozen server runs outside the repo
        run: cd / && /opt/no_human/resources/nh-server/nh --version

      # The product does not bundle the Claude Code CLI on any platform, and
      # `nh start` REFUSES to serve without it (_assert_backend_usable: "the
      # board would load but every task would fail at launch") — so a user's
      # first step, and the runner's, is to install it. The REAL CLI, the way
      # docs/LINUX.md §5 says (npm -g lands on the runner's PATH), not a stub:
      # a stub would prove the refusal is bypassable, not that the documented
      # install path works. No token is ever validated in this job — the dummy
      # credential only satisfies the presence check; no task is started.
      # npm install -g is idempotent — reinstalling the same global package
      # converges — so a bounded retry is safe. The presence/version checks
      # are NOT retried: a genuinely broken install must still fail the step.
      - name: Install the Claude Code CLI the way a user would
        timeout-minutes: 5
        run: |
          n=1
          until npm install -g @anthropic-ai/claude-code; do
            if [ "$n" -ge 2 ]; then echo "npm install -g claude-code failed on both attempts"; exit 1; fi
            n=$((n + 1)); sleep 15
          done
          command -v claude && claude --version

      # ONE throwaway HOME for the install/acceptance/uninstall steps below:
      # each `run:` is its own shell, so it rides in $GITHUB_ENV. The uninstall
      # step asserts on THIS home — the one the app actually wrote to — not a
      # fresh directory the package never touched.
      - name: Throwaway HOME for the installed-app run
        run: echo "NH_ACCEPT_HOME=$(mktemp -d)" >> "$GITHUB_ENV"

      # Sandboxed, like a user's launch: the .deb's .desktop Exec is the bare
      # binary, and the driver passes chromiumSandbox: true so Playwright does
      # not inject --no-sandbox — a broken chrome-sandbox / userns setup fails
      # HERE, not only on a user's machine.
      - name: Installed app — first run -> board -> quit (throwaway HOME, Xvfb)
        run: |
          O="$RUNNER_TEMP/linux-acceptance"
          xvfb-run -a --server-args="-screen 0 1440x900x24" \
            node packaging/linux-acceptance.mjs --exe /opt/no_human/no_human \
              --home "$NH_ACCEPT_HOME" --out "$O" --mode setup

      # The AppImage carries the same payload; run it EXTRACTED because the
      # runner has no FUSE. That sidesteps the two real-desktop frictions
      # (libfuse2, AppArmor userns) on purpose — they are Lane B's to observe.
      - name: AppImage — the same run, extracted
        run: |
          H="$(mktemp -d)"; O="$RUNNER_TEMP/linux-acceptance-appimage"
          A="$(ls "$PWD"/desktop/dist/no_human-*-linux-x86_64.AppImage)"; chmod +x "$A"
          X="$RUNNER_TEMP/appimage"; mkdir -p "$X"; (cd "$X" && "$A" --appimage-extract >/dev/null)
          # AppRun is the launcher a user's double-click reaches. The driver
          # launches with chromiumSandbox: true (Playwright would otherwise
          # inject --no-sandbox on Linux and short-circuit everything below), so
          # AppRun's own `unshare -Ur true` probe actually runs (appImageUtil.js);
          # on this 22.04 runner unprivileged userns WORKS, so the probe passes
          # and the app runs SANDBOXED — the --no-sandbox path is never taken
          # here. The generated .desktop Exec (`AppRun --no-sandbox %U`,
          # AppImageTarget.js) is a different path a runner without a desktop
          # cannot take — Lane B on a real 24.04 desktop is where both are
          # observed (docs/LINUX.md §7 row 11).
          xvfb-run -a --server-args="-screen 0 1440x900x24" \
            node packaging/linux-acceptance.mjs --exe "$X/squashfs-root/AppRun" \
              --home "$H" --out "$O" --mode setup

      # Uninstall must not delete the operator's config and task history —
      # the same row as docs/WINDOWS.md §5.4.
      # A pure assertion step (test -f on the throwaway HOME, apt-get remove,
      # post-conditions). Retrying an assertion is retrying a verdict — bound
      # only, not retried.
      - name: Uninstall keeps the user's data
        timeout-minutes: 5
        run: |
          test -f "$NH_ACCEPT_HOME/.no_human/.env"      # written by the acceptance run above
          test -f "$NH_ACCEPT_HOME/.no_human/no_human.db"
          sudo apt-get remove -y no-human-desktop
          test ! -e /opt/no_human/no_human
          test -f "$NH_ACCEPT_HOME/.no_human/.env"
          test -f "$NH_ACCEPT_HOME/.no_human/no_human.db"

      - name: Checksums
        working-directory: desktop/dist
        run: sha256sum no_human-*-linux-amd64.deb no_human-*-linux-x86_64.AppImage | tee SHA256SUMS-linux.txt

      # EVIDENCE always; the APP only on a release build. Two uploads, split on
      # purpose: this workflow ships to the PUBLIC repo, where a run artefact is
      # downloadable by any signed-in GitHub user for its retention window — so
      # a .deb built from a random main push would be an unsigned, never-walked
      # Linux app on offer, exactly what the windows job's comment above refuses
      # ("an unsigned server bundle parked as a downloadable CI artifact reads
      # like a deliverable and is not one") and what docs/LINUX.md's status
      # block promises will not happen before §6/§7 are filled. Screenshots,
      # sums and the stamp are what a human needs to READ the run; the packages
      # ride only when a human asked for a release build via workflow_dispatch
      # WITH linux_release=true — docs/LINUX.md §4 defines that run as the
      # release build (a bare dispatch is the nightly guards' handle) — and even then
      # for 7 days, to be attached to the GitHub release by hand after the sums
      # are re-verified. latest-linux.yml is never attached to a release: no
      # Linux update path ships (nhCanAutoUpdate is false on every platform).
      - name: Gather the evidence under one root
        if: always()
        run: |
          E="$RUNNER_TEMP/linux-evidence"; mkdir -p "$E"
          cp desktop/dist/SHA256SUMS-linux.txt "$E/" 2>/dev/null || true
          cp desktop/dist/linux-unpacked/resources/nh-server/BUILD_STAMP "$E/" 2>/dev/null || true
          [ -d "$RUNNER_TEMP/linux-acceptance" ] && cp -R "$RUNNER_TEMP/linux-acceptance" "$E/deb" || true
          [ -d "$RUNNER_TEMP/linux-acceptance-appimage" ] && cp -R "$RUNNER_TEMP/linux-acceptance-appimage" "$E/appimage" || true
          ls -laR "$E"
      - name: Upload the evidence (every run)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x86_64-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/linux-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the packages (release build only — workflow_dispatch with linux_release)
        if: github.event_name == 'workflow_dispatch' && inputs.linux_release
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-${{ github.sha }}
          path: |
            desktop/dist/no_human-*-linux-amd64.deb
            desktop/dist/no_human-*-linux-x86_64.AppImage
            desktop/dist/latest-linux.yml
            desktop/dist/SHA256SUMS-linux.txt
            desktop/dist/linux-unpacked/resources/nh-server/BUILD_STAMP
          if-no-files-found: error
          retention-days: 7
