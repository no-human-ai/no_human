# CLA nudge — the moment a pull request is opened or pushed to, tell any commit
# author without a contributors/ ledger entry exactly which file to add, in one
# comment that updates itself. The `CLA ledger` job in ci.yml stays the gate;
# this removes the guessing (a first contributor otherwise learns about the
# ledger from a red check after a maintainer approves the run).
#
# `pull_request_target` runs on the BASE repository with its token — no
# "approve and run" gate for first-time contributors — which is exactly why
# scripts/cla_nudge.sh never checks out or executes anything from the fork:
# the checkout below is the base branch, and the PR's tree is consulted only
# through the contents API (one directory listing per run, whatever the PR
# carries). Keep it that way.
name: CLA nudge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cla-nudge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  nudge:
    name: CLA nudge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Base branch only (the default for pull_request_target): CLA.md's
      # version line and scripts/cla_nudge.sh come from main, never the fork.
      - uses: actions/checkout@v4

      - name: Tell an unsigned author which file to add
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Head merged onto CURRENT main — the tree the CLA ledger job's
          # checkout sees. Empty while GitHub has not computed it, or stale
          # by one push; the script trusts it only when its second parent is
          # HEAD_SHA, else polls ~30 s and, if there is still none, posts
          # nothing and exits green — the log says why; the next push retries.
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          # Same exemption as the CLA ledger job: the maintainer does not sign
          # their own agreement.
          MAINTAINER: eyalgolan
          # Who OPENED the PR — gates the agent-account exemption the same
          # way the CLA ledger job does.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: bash scripts/cla_nudge.sh
